
{% extends "layout.html" %}

{% block content %}
<section aria-labelledby="editar-usuario-title">
    <h1 id="editar-usuario-title">Editar usuario</h1>

    <form method="post" action="{{ url_for('usuarios.edicion_usuarios.edit') }}">
        <input type="hidden" name="accion" value="guardar">

        <div>
            <label for="email">Correo electrónico:</label>
            <input
                type="email"
                id="email"
                name="email"
                value="{{ usuario.email }}"
                required
            >
        </div>

        <div>
            <label for="alias">Alias:</label>
            <input
                type="text"
                id="alias"
                name="alias"
                value="{{ usuario.alias }}"
                required
            >
        </div>

        <div>
            <label for="rol_id">Rol:</label>
            <select id="rol_id" name="rol_id" required>
                {% for rol in roles %}
                    <option
                        value="{{ rol.idRol }}"
                        {% if rol.idRol == usuario.idRol %}selected{% endif %}
                    >
                        {{ rol.nombre }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label for="password">Nueva contraseña (opcional):</label>
            <input
                type="password"
                id="password"
                name="password"
                autocomplete="new-password"
            >
            <small>
                Dejá el campo vacío para conservar la contraseña actual.
            </small>
        </div>

        <div>
            <input
                type="checkbox"
                id="is_system_admin"
                name="is_system_admin"
                {% if usuario.isSystemAdmin %}checked{% endif %}
            >
            <label for="is_system_admin">
                Administrador del sistema
            </label>
        </div>

        <button type="submit">Guardar cambios</button>
        <a href="{{ url_for('usuarios.listado_usuarios.index') }}">
            Cancelar
        </a>
    </form>
</section>
{% endblock %}
