{% extends "layout.html" %}

{% block content %}
<main>
    <h1>{{ "Editar Personal" if persona else "Registrar Nuevo Personal" }}</h1>

    {% if errores %}
        <section aria-label="Errores de validación" style="color: red; margin-bottom: 1rem;">
            <ul>
                {% for err in errores %}
                    <li>{{ err }}</li>
                {% endfor %}
            </ul>
        </section>
    {% endif %}

    <section>
        <form method="POST" action="{{ url_for('personal.editar', id=persona.idPersonal) if persona else url_for('personal.nuevo') }}">
            <div>
                <label for="dni">DNI *</label><br>
                <input 
                    type="text" 
                    id="dni" 
                    name="dni" 
                    required 
                    maxlength="10"
                    value="{{ valores.dni if valores else (persona.dni if persona else '') }}"
                >
            </div>

            <div style="margin-top: 1rem;">
                <label for="apellido">Apellido *</label><br>
                <input 
                    type="text" 
                    id="apellido" 
                    name="apellido" 
                    required 
                    value="{{ valores.apellido if valores else (persona.apellido if persona else '') }}"
                >
            </div>

            <div style="margin-top: 1rem;">
                <label for="nombre">Nombre *</label><br>
                <input 
                    type="text" 
                    id="nombre" 
                    name="nombre" 
                    required 
                    value="{{ valores.nombre if valores else (persona.nombre if persona else '') }}"
                >
            </div>

            <div style="margin-top: 1rem;">
                <label for="idTipoPersonal">Tipo de Personal *</label><br>
                <select id="idTipoPersonal" name="idTipoPersonal" required>
                    <option value="" disabled {{ 'selected' if not persona and not valores }}>Seleccionar tipo...</option>
                    {% for tp in tipos_personal %}
                        {% set seleccionado = (valores and valores.idTipoPersonal == tp.idTipoPersonal|string) or (persona and persona.idTipoPersonal == tp.idTipoPersonal) %}
                        <option value="{{ tp.idTipoPersonal }}" {{ 'selected' if seleccionado }}>
                            {{ tp.nombre }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div style="margin-top: 1rem;">
                <label for="idTipoMenu">Tipo de Menú *</label><br>
                <select id="idTipoMenu" name="idTipoMenu" required>
                    <option value="" disabled {{ 'selected' if not persona and not valores }}>Seleccionar menú...</option>
                    {% for tm in tipos_menu %}
                        {% set seleccionado = (valores and valores.idTipoMenu == tm.idTipoMenu|string) or (persona and persona.idTipoMenu == tm.idTipoMenu) %}
                        <option value="{{ tm.idTipoMenu }}" {{ 'selected' if seleccionado }}>
                            {{ tm.nombre }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div style="margin-top: 1.5rem;">
                <button type="submit">
                    {{ "Guardar Cambios" if persona else "Registrar Personal" }}
                </button>
                <a href="{{ url_for('personal.index') }}" style="margin-left: 1rem;">Cancelar</a>
            </div>
        </form>
    </section>
</main>
{% endblock %}
